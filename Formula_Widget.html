<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Button Formula Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media', // Automatically uses system preference
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root, html, body {
            color-scheme: light dark;
            background-color: transparent !important;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        /* Custom scrollbar - Light mode defaults */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af; 
        }
        
        /* Dark mode overrides */
        @media (prefers-color-scheme: dark) {
            ::-webkit-scrollbar-thumb {
                background: #474c50; 
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #5c6266; 
            }
            input[type="time"]::-webkit-calendar-picker-indicator {
                filter: invert(0.8);
                cursor: pointer;
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-[#487CA5] dark:text-[#447ACB] transition-colors duration-200">

    <div class="w-full max-w-2xl bg-[#E9F3F7] dark:bg-[#1F282D] rounded-[4px] border-4 border-[#487CA5] dark:border-[#447ACB] p-6 sm:p-8 transition-colors duration-200">
        
        <div class="mb-8">
            <h1 class="text-2xl font-semibold text-[#487CA5] dark:text-[#447ACB] mb-2 flex items-center gap-2 transition-colors duration-200">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#337EA9] dark:text-[#2E7CD1]"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                Notion Formula Generator
            </h1>
            <p class="text-sm text-[#487CA5] dark:text-[#447ACB] opacity-80 transition-colors duration-200">Generate date and time formulas for your Notion buttons effortlessly.</p>
        </div>

        <!-- Controls -->
        <div class="space-y-6">
            
            <!-- Time Inputs -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="flex flex-col gap-1.5">
                    <label for="startTime" class="text-sm font-medium text-[#487CA5] dark:text-[#447ACB] transition-colors duration-200">Start Time</label>
                    <input type="time" id="startTime" value="05:00" 
                           class="bg-white/50 dark:bg-black/20 border border-[#487CA5]/30 dark:border-[#447ACB]/30 rounded-[4px] px-3 py-2 text-[#487CA5] dark:text-[#447ACB] focus:outline-none focus:border-[#337EA9] dark:focus:border-[#2E7CD1] focus:ring-1 focus:ring-[#337EA9] dark:focus:ring-[#2E7CD1] transition-colors duration-200">
                </div>
                
                <div class="flex flex-col gap-1.5">
                    <label for="endTime" class="text-sm font-medium text-[#487CA5] dark:text-[#447ACB] transition-colors duration-200">End Time</label>
                    <input type="time" id="endTime" value="06:00" 
                           class="bg-white/50 dark:bg-black/20 border border-[#487CA5]/30 dark:border-[#447ACB]/30 rounded-[4px] px-3 py-2 text-[#487CA5] dark:text-[#447ACB] focus:outline-none focus:border-[#337EA9] dark:focus:border-[#2E7CD1] focus:ring-1 focus:ring-[#337EA9] dark:focus:ring-[#2E7CD1] transition-colors duration-200">
                </div>
            </div>

            <!-- Next Day Checkbox -->
            <div class="flex flex-col gap-2 pt-2">
                <label class="flex items-center gap-2 cursor-pointer group w-fit">
                    <input type="checkbox" id="nextDayCheck" class="hidden peer">
                    <div class="w-4 h-4 rounded-[4px] border border-[#487CA5] dark:border-[#447ACB] peer-checked:bg-[#337EA9] peer-checked:border-[#337EA9] dark:peer-checked:bg-[#2E7CD1] dark:peer-checked:border-[#2E7CD1] flex items-center justify-center transition-all">
                        <svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <span class="text-sm font-medium text-[#487CA5] dark:text-[#447ACB] opacity-80 group-hover:opacity-100 transition-opacity duration-200">End time is on the next day</span>
                </label>
            </div>

            <!-- Output Area -->
            <div class="pt-4 flex flex-col gap-2">
                <div class="flex justify-between items-end">
                    <label class="text-sm font-medium text-[#487CA5] dark:text-[#447ACB] transition-colors duration-200">Generated Formula</label>
                    <button id="copyBtn" class="text-xs flex items-center gap-1.5 bg-[#337EA9] hover:bg-[#265e7d] dark:bg-[#2E7CD1] dark:hover:bg-[#215a99] text-white px-3 py-1.5 rounded-[4px] transition-colors shadow-sm">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        <span id="copyText">Copy</span>
                    </button>
                </div>
                <div class="relative bg-white/50 dark:bg-black/20 border border-[#487CA5]/30 dark:border-[#447ACB]/30 rounded-[4px] p-4 font-mono text-sm overflow-x-auto transition-colors duration-200">
                    <code id="formulaOutput" class="text-[#487CA5] dark:text-[#447ACB] whitespace-pre-wrap break-all block transition-colors duration-200"></code>
                </div>
            </div>

        </div>
    </div>

    <script>
        // DOM Elements
        const startTimeInput = document.getElementById('startTime');
        const endTimeInput = document.getElementById('endTime');
        const nextDayCheck = document.getElementById('nextDayCheck');
        const formulaOutput = document.getElementById('formulaOutput');
        const copyBtn = document.getElementById('copyBtn');
        const copyText = document.getElementById('copyText');

        // Parse HH:MM to Number
        function parseTime(timeString) {
            if (!timeString) return { h: 0, m: 0, raw: 0 };
            const parts = timeString.split(':');
            const h = parseInt(parts[0], 10) || 0;
            const m = parseInt(parts[1], 10) || 0;
            return {
                h, m, raw: (h * 60) + m
            };
        }

        // Build a single date segment
        function buildSegment(baseVariable, h, m, isNextDay = false) {
            let segment = baseVariable;
            if (isNextDay) {
                segment += `.dateAdd(1, "days")`;
            }
            if (h > 0) {
                segment += `.dateAdd(${h}, "hours")`;
            }
            if (m > 0) {
                segment += `.dateAdd(${m}, "minutes")`;
            }
            return segment;
        }

        // Generate the full formula
        function generateFormula(e) {
            const start = parseTime(startTimeInput.value);
            const end = parseTime(endTimeInput.value);
            
            // Auto-check next day if end time is before start time
            // Only trigger auto-check if the event came from the time inputs
            if (e && (e.target === startTimeInput || e.target === endTimeInput)) {
                if (end.raw < start.raw) {
                    nextDayCheck.checked = true;
                } else {
                    nextDayCheck.checked = false;
                }
            }

            const isNextDay = nextDayCheck.checked;
            const baseVar = "d";
            
            const startSegment = buildSegment(baseVar, start.h, start.m, false);
            const endSegment = buildSegment(baseVar, end.h, end.m, isNextDay);
            
            const finalFormula = `let(\n  d, today(),\n  dateRange(\n    ${startSegment},\n    ${endSegment}\n  )\n)`;

            formulaOutput.textContent = finalFormula;
        }

        // Copy functionality using a robust fallback mechanism
        function copyToClipboard() {
            const textToCopy = formulaOutput.textContent;
            
            // Fallback for iFrame environments (like this collaborative space)
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            
            // Avoid scrolling to bottom
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";

            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if(successful) {
                    copyText.textContent = "Copied!";
                    copyBtn.classList.remove('bg-[#337EA9]', 'hover:bg-[#265e7d]', 'dark:bg-[#2E7CD1]', 'dark:hover:bg-[#215a99]');
                    copyBtn.classList.add('bg-green-600', 'hover:bg-green-700', 'dark:bg-green-600', 'dark:hover:bg-green-700');
                    
                    setTimeout(() => {
                        copyText.textContent = "Copy";
                        copyBtn.classList.add('bg-[#337EA9]', 'hover:bg-[#265e7d]', 'dark:bg-[#2E7CD1]', 'dark:hover:bg-[#215a99]');
                        copyBtn.classList.remove('bg-green-600', 'hover:bg-green-700', 'dark:bg-green-600', 'dark:hover:bg-green-700');
                    }, 2000);
                } else {
                    throw new Error("execCommand failed");
                }
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
                copyText.textContent = "Failed";
                setTimeout(() => copyText.textContent = "Copy", 2000);
            }

            document.body.removeChild(textArea);
        }

        // Event Listeners
        startTimeInput.addEventListener('input', generateFormula);
        endTimeInput.addEventListener('input', generateFormula);
        nextDayCheck.addEventListener('change', generateFormula);
        copyBtn.addEventListener('click', copyToClipboard);

        // Initial Generation
        generateFormula();
    </script>
</body>
</html>
